<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120">
  <!-- 8-pointed star tessellation — center star + quarter-stars at all 4 corners -->
  <!-- R=42, r=17.4 in a 120px tile; tips of adjacent stars are ~0.85px apart, producing the interlocked look -->

  <!-- Center star at (60,60) -->
  <polygon fill="none" stroke="#c9a227" stroke-width="0.8" stroke-opacity="0.10"
    points="60,18 66.66,43.92 89.7,30.3 76.08,53.34 102,60 76.08,66.66 89.7,89.7 66.66,76.08 60,102 53.34,76.08 30.3,89.7 43.92,66.66 18,60 43.92,53.34 30.3,30.3 53.34,43.92"/>

  <!-- Corner star centered at (0,0) — only lower-right quadrant visible in this tile -->
  <polygon fill="none" stroke="#c9a227" stroke-width="0.8" stroke-opacity="0.10"
    points="0,-42 6.66,-16.08 29.7,-29.7 16.08,-6.66 42,0 16.08,6.66 29.7,29.7 6.66,16.08 0,42 -6.66,16.08 -29.7,29.7 -16.08,6.66 -42,0 -16.08,-6.66 -29.7,-29.7 -6.66,-16.08"/>

  <!-- Corner star centered at (120,0) — lower-left quadrant visible -->
  <polygon fill="none" stroke="#c9a227" stroke-width="0.8" stroke-opacity="0.10"
    points="120,-42 126.66,-16.08 149.7,-29.7 136.08,-6.66 162,0 136.08,6.66 149.7,29.7 126.66,16.08 120,42 113.34,16.08 90.3,29.7 103.92,6.66 78,0 103.92,-6.66 90.3,-29.7 113.34,-16.08"/>

  <!-- Corner star centered at (0,120) — upper-right quadrant visible -->
  <polygon fill="none" stroke="#c9a227" stroke-width="0.8" stroke-opacity="0.10"
    points="0,78 6.66,103.92 29.7,90.3 16.08,113.34 42,120 16.08,126.66 29.7,149.7 6.66,136.08 0,162 -6.66,136.08 -29.7,149.7 -16.08,126.66 -42,120 -16.08,113.34 -29.7,90.3 -6.66,103.92"/>

  <!-- Corner star centered at (120,120) — upper-left quadrant visible -->
  <polygon fill="none" stroke="#c9a227" stroke-width="0.8" stroke-opacity="0.10"
    points="120,78 126.66,103.92 149.7,90.3 136.08,113.34 162,120 136.08,126.66 149.7,149.7 126.66,136.08 120,162 113.34,136.08 90.3,149.7 103.92,126.66 78,120 103.92,113.34 90.3,90.3 113.34,103.92"/>
</svg>
